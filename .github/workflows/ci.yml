name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Instruction hygiene
        run: python scripts/lint-instructions.py
      - name: Runtime tests
        run: python -m unittest discover -s tests
      - name: NoGapBench
        run: python -m unittest discover -s benchmarks
      - name: Council template
        run: python scripts/validate-council.py .code-loop-template
      - name: Package sync
        run: python scripts/build-dist.py --check
      - name: F1 kernel adversarial tests
        run: python -m unittest tests.test_f1_kernel -v
      - name: F1 registry adversarial tests
        run: python -m unittest tests.test_f1_registry -v
      - name: F1 commitment adversarial tests
        run: python -m unittest tests.test_f1_commitments -v
      - name: F1 Stage 1 adversarial tests
        run: python -m unittest tests.test_f1_stage1 -v
      - name: F1 transactional state adversarial tests
        run: python -m unittest tests.test_f1_state -v
      - name: F1 durable wiring integration tests
        run: python -m unittest tests.test_f1_durable -v
      - name: F1 Stage 2 adversarial tests
        run: python -m unittest tests.test_f1_stage2 -v
      - name: F1 state ingest adversarial tests
        run: python -m unittest tests.test_f1_ingest -v
      - name: F1 controller/worker adversarial tests
        run: python -m unittest tests.test_f1_controller -v
      - name: F1 provisioning and reachability tests
        run: python -m unittest tests.test_f1_bootstrap -v
      - name: F1 trusted verify wiring tests
        run: python -m unittest tests.test_f1_runtime_verify -v
      - name: Prebuild barrier fail-closed tests
        run: python -m unittest tests.test_methodology_preflight_failclosed -v
      - name: Direct execution authorization tests
        run: python -m unittest tests.test_execute_authorization -v
      - name: F2a required-kind semantics
        run: python -m unittest tests.test_completion_vs_recovery_obligations -v
      - name: F1 contract continuity
        run: python scripts/check-f1-continuity.py
      - name: F1 enumeration closure
        run: python scripts/check-f1-enumerations.py
